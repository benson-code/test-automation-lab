name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: API tests
    runs-on: ubuntu-24.04-arm
    env:
      BASE_URL: http://127.0.0.1:8400
      DB_PATH: ${{ github.workspace }}/ci-wallet.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Start the API
        run: |
          nohup python -m uvicorn app.main:app --port 8400 > api.log 2>&1 &
          for i in $(seq 30); do curl -sf "$BASE_URL/health" && exit 0; sleep 1; done
          echo "API did not start"; cat api.log; exit 1

      - name: Smoke (stop here if the main flow is broken)
        run: >
          pytest --env=external --base-url="$BASE_URL" --db-path="$DB_PATH"
          --target_marks=smoke

      - name: Full regression
        run: >
          pytest --env=external --base-url="$BASE_URL" --db-path="$DB_PATH"
          --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/
            api.log

  fault-check:
    name: Tests catch planted bugs
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/fault_check.py --api-only

  newman:
    name: Postman collection (Newman)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g newman@6.2.2 newman-reporter-htmlextra@1.23.1

      - name: Run the collection (main flow + CSV amount boundaries)
        run: postman/run-newman.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: reports/newman/

      - name: Newman catches planted bugs
        run: python tools/newman_fault_check.py

  web:
    name: Web UI tests (Playwright)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the front end
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-web.txt
      - name: Install the browsers (Chromium, WebKit, Firefox)
        run: python -m playwright install --with-deps chromium webkit firefox

      # 每個案例在三種設定各跑一次，各用自己的引擎：Pixel 7 + Chromium、iPhone 14 + WebKit（Safari 的
      # 引擎）、桌機 + Firefox。失敗時截圖與 trace 留在 reports/web/
      - name: Web UI tests
        run: >
          pytest tests/web
          --html=reports/web-report.html --self-contained-html --junitxml=reports/web-junit.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-report
          path: reports/

      # 伺服器的埋 bug 開關：WEB-004、005、008、009 必須失敗
      - name: Web tests catch planted bugs
        run: python tools/fault_check.py --web-only

      # 只存在於網頁的規則：故意改壞網頁程式，WEB-007、012、013、014 必須失敗
      - name: Web tests catch broken page code (mutation check)
        run: python tools/web_mutation_check.py

  android:
    name: Android app (build and unit tests)
    # x64: Google ships the Android build tools (aapt2) for x86_64 Linux only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # 也會比對 Gradle wrapper jar 的官方校驗碼；快取用開源（MIT）的 basic，不用預設的商業元件
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 單元測試包含 DesignTokenParityTest：App 的設計 token 必須和網頁的 tokens.css 一致
      - name: Build the debug app and run the unit tests
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload the app and the unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/

  app:
    name: Android app UI tests (Appium, emulator)
    needs: android
    # x64: the emulator needs KVM, which GitHub's x64 Linux runners provide
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # 測上一個 job 編出來的 debug APK，放回 tests/app 預設的位置
      - uses: actions/download-artifact@v8
        with:
          name: android-app
          path: android/app/build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-app.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0

      - name: Start Appium
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp > appium.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start"; cat appium.log; exit 1

      # Pixel 7、Android 16（API 36，App 的 target），和 Mac 上的模擬器同一個版本，只是 x86_64 映像。
      # script 每一行是一個獨立的指令；第一行失敗就不跑第二行
      - name: App UI tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            pytest tests/app --app --html=reports/app-report.html --self-contained-html --junitxml=reports/app-junit.xml
            python tools/fault_check.py --app-only

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-report
          path: |
            reports/
            appium.log

  ios:
    name: iOS app (build, unit and UI tests)
    # GitHub 的標準 macOS runner（arm64）：預設 Xcode 26.6，iOS 模擬器 26.2、26.4、26.5（runner-images 的
    # macos-26-arm64 說明，2026-10 查的）。App 要 Xcode 26 以上：預設在 main actor 上執行是 Swift 6.2 的設定
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-app.txt

      - name: Show Xcode and the simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # 三個 iOS 版本都有叫「iPhone 17」的模擬器，用名字找不知道會是哪一台：挑最新 iOS 那台的 UDID，
      # 之後的指令和 pytest（IOS_UDID）都用它
      - name: Boot an iPhone 17 simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda runtime: [int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-")]
          runtimes = sorted((r for r in devices if "iOS-" in r and any(d["name"] == "iPhone 17" for d in devices[r])), key=version)
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"] == "iPhone 17"))
          ')
          echo "IOS_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      # 單元測試（ios/WalletTests）包含 DesignTokenParityTests 和 MessagesSpecParityTests。
      # 同時把 App 編到 UI 測試預設的位置：ios/build/Build/Products/Debug-iphonesimulator/Wallet.app
      - name: Build the app and run its unit tests
        run: >
          xcodebuild test -project ios/Wallet.xcodeproj -scheme Wallet
          -destination "platform=iOS Simulator,id=$IOS_UDID" -derivedDataPath ios/build
          -resultBundlePath reports/ios-unit.xcresult
          -test-timeouts-enabled YES -default-test-execution-time-allowance 60

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Appium and the XCUITest driver
        run: |
          npm install -g appium@3.8.0
          appium driver install xcuitest@12.17.1

      - name: Start Appium
        run: |
          nohup appium --address 127.0.0.1 --port 4723 --log-timestamp > appium.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && exit 0; sleep 1; done
          echo "Appium did not start"; cat appium.log; exit 1

      # 第一個 session 要先編譯 WebDriverAgent，要好幾分鐘（tests/ios/conftest.py 最多等 10 分鐘）
      - name: iOS UI tests on the simulator
        run: pytest tests/ios --ios --html=reports/ios-report.html --self-contained-html --junitxml=reports/ios-junit.xml

      - name: Tests catch planted bugs (iOS cases)
        run: python tools/fault_check.py --ios-only

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-report
          path: |
            reports/
            appium.log
